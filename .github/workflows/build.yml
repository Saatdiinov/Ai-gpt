name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libffi-dev libssl-dev zip unzip openjdk-17-jdk
        yes | buildozer android debug || true

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: AI-GPT-App
        path: bin/*.apk
